apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fivoria
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: fivoria/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: fivoria-config
              key: API_URL
        - name: NEXT_PUBLIC_AGENT_URL
          value: "https://agent.fivoria.tech"
        - name: NEXT_PUBLIC_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: fivoria-config
              key: DOMAIN
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 2
