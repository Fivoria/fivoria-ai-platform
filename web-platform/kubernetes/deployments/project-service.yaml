apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivoria-project-service
  namespace: fivoria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fivoria-project-service
  template:
    metadata:
      labels:
        app: fivoria-project-service
    spec:
      containers:
      - name: project-service
        image: fivoria/project-service:latest
        ports:
        - containerPort: 8003
        volumeMounts:
        - name: workspaces
          mountPath: /tmp/fivoria-workspaces
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: workspaces
        persistentVolumeClaim:
          claimName: fivoria-workspaces-pvc
