apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivoria-agent-api
  namespace: fivoria
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fivoria-agent-api
  template:
    metadata:
      labels:
        app: fivoria-agent-api
    spec:
      containers:
      - name: agent-api
        image: fivoria/agent-api:latest
        ports:
        - containerPort: 8002
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: fivoria-config
              key: REDIS_URL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
