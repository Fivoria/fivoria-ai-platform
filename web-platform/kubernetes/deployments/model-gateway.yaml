apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivoria-model-gateway
  namespace: fivoria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fivoria-model-gateway
  template:
    metadata:
      labels:
        app: fivoria-model-gateway
    spec:
      containers:
      - name: model-gateway
        image: fivoria/model-gateway:latest
        ports:
        - containerPort: 8004
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
