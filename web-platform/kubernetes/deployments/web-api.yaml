apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivoria-web-api
  namespace: fivoria
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fivoria-web-api
  template:
    metadata:
      labels:
        app: fivoria-web-api
    spec:
      containers:
      - name: web-api
        image: fivoria/web-api:latest
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: fivoria-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
