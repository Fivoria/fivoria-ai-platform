apiVersion: apps/v1
kind: Deployment
metadata:
  name: fivoria-preview-service
  namespace: fivoria
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fivoria-preview-service
  template:
    metadata:
      labels:
        app: fivoria-preview-service
    spec:
      containers:
      - name: preview-service
        image: fivoria/preview-service:latest
        ports:
        - containerPort: 8005
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
