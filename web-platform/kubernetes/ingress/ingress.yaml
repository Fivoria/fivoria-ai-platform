apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fivoria-ingress
  namespace: fivoria
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - fivoria.example.com
    secretName: fivoria-tls
  rules:
  - host: fivoria.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fivoria-frontend
            port:
              number: 80
