apiVersion: v1
kind: Secret
metadata:
  name: fivoria-secrets
  namespace: fivoria
type: Opaque
stringData:
  database-url: "mysql://fivoria:CHANGE_ME@mysql:3306/fivoria"
  redis-url: "redis://:CHANGE_ME@redis:6379/0"
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  api-key-encryption-key: "CHANGE_ME_IN_PRODUCTION"
